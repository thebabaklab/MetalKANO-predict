name: Keep Streamlit app awake

# Runs every 12 hours and can also be triggered manually from the Actions tab.
# The job opens the Streamlit Community Cloud app in a real headless browser,
# which is the only reliable way to reset the 24h sleep timer — plain HTTP
# pings (curl, UptimeRobot) are NOT enough because the wake button is
# JS-rendered and Streamlit only counts visits with a real websocket session.
on:
  schedule:
    - cron: "0 */12 * * *"   # 00:00 and 12:00 UTC every day
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install "playwright==1.47.0"
          python -m playwright install --with-deps chromium

      - name: Wake the app
        run: python scripts/wake_streamlit.py
